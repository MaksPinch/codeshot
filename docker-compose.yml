services:
  web:
    build: .
    command:
      ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: postgres_db_codeshot
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_codeshot:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  worker:
    build: .
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data_codeshot:
