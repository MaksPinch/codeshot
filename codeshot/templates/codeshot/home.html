<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <h1>{{ title }}</h1>
        <p>{{ subtitle }}</p>
      </section>

      <section class="workspace">
        <section class="editor-panel" aria-label="Code editor">
          <form method="post" class="code-form">
            {% csrf_token %}
            <div>
              <label for="{{ form.language.id_for_label }}">Language</label>
              {{ form.language }} {{ form.language.errors }}
            </div>
            <div>
              <label for="{{ form.filename.id_for_label }}">Filename</label>
              {{ form.filename }} {{ form.filename.errors }}
            </div>
            <div>
              <label for="{{ form.code.id_for_label }}">Code</label>
              {{ form.code }} {{ form.code.errors }}
            </div>
            <button type="submit">Generate preview</button>
          </form>
        </section>

        <section class="preview-panel" aria-label="Preview">
          <h2>Preview</h2>
          <div class="preview-frame">
            {% if highlighted_code %}
              {{ highlighted_code|safe }}
            {% else %}
              <pre><code>Preview will appear here.</code></pre>
            {% endif %}
          </div>
        </section>

      </section>
    </main>
  </body>
</html>
