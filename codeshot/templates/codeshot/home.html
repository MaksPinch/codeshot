<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
  </head>
  <body>
    <main>
      <section>
        <h1>{{ title }}</h1>
        <p>{{ subtitle }}</p>
      </section>
      <section>
        <form method="post">
          {% csrf_token %}
          <div>
            <label for="{{ form.language.id_for_label }}">Language</label>
            {{ form.language }} {{ form.language.errors }}
          </div>
          <div>
            <label for="{{ form.filename.id_for_label }}">Filename</label>
            {{ form.filename }} {{ form.filename.errors }}
          </div>
          <div>
            <label for="{{ form.code.id_for_label }}">Code</label>
            {{ form.code }} {{ form.code.errors }}
          </div>
          <button type="submit">Generate preview</button>
        </form>
      <section aria-label="Preview">
        <h2>Preview</h2>
        {% if highlighted_code %} {{ highlighted_code|safe }} {% else %} <pre><code>Preview will appear here.</code></pre> {% endif %}
      </section>
    </main>
  </body>
</html>
